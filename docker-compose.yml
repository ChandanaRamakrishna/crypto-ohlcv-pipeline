services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports:
      - "5433:5432"          # host port 5433 so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./sql/queries.sql:/queries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Airflow reads AIRFLOW_CONN_<ID> as a connection; this one is conn id "market_db"
      AIRFLOW_CONN_MARKET_DB: postgres://market:market@postgres:5432/market
      BINANCE_BASE_URL: https://data-api.binance.vision
      SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow scheduler &
        exec airflow webserver

volumes:
  pgdata:
